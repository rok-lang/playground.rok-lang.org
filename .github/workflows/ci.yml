# Build and test the compile server on every push. It does not deploy:
# deploy.yml does, on the release branch.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The newest release of the series rok.rokon pins, as the deploy.
      - name: Install rok
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pin=$(sed -n 's/^ *toolchain: *"\([0-9.]*\)",*$/\1/p' rok.rokon | sed 's/\./\\./g')
          [ -n "$pin" ] || { echo 'rok.rokon pins no toolchain; add toolchain: "0.2"' >&2; exit 1; }
          v=$(gh release list -R rok-lang/rok --exclude-drafts --exclude-pre-releases -L 100 --json tagName -q '.[].tagName' |
            sed -n "s/^v\($pin\(\.[0-9][0-9]*\)*\)$/\1/p" | sort -V | tail -n1)
          [ -n "$v" ] || { echo "no rok release in the pinned series" >&2; exit 1; }
          curl -fsSL "https://raw.githubusercontent.com/rok-lang/rok/v$v/install.sh" | ROK_NO_MODIFY_PATH=1 sh -s -- -q --version "$v"
          echo "$HOME/.rok/bin" >> "$GITHUB_PATH"

      - name: Build
        run: rok build --release

      - name: Test
        run: rok test

      # The sandbox image (scripts/Dockerfile) is built on deploy.
