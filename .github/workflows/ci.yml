# Build and test the compile server on every push. It does not deploy:
# deploy.yml does, on the release branch.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The latest rok release, the one the deploy builds and serves with.
      - name: Install rok
        run: |
          curl -fsSL https://rok-lang.org/install.sh | ROK_NO_MODIFY_PATH=1 sh -s -- -q
          echo "$HOME/.rok/bin" >> "$GITHUB_PATH"

      - name: Build
        run: rok build --release

      - name: Test
        run: rok test

      # The sandbox image (scripts/Dockerfile) is built on deploy.
